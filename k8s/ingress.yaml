apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-showcase
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-showcase
                port:
                  number: 80
