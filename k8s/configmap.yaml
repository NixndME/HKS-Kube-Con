apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-showcase-html
data:
  # nginx fills in $APP_VERSION and $APP_COLOR on startup. No custom image needed.
  index.html.template: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>K8s Showcase</title>
    </head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 10%; background-color: ${APP_COLOR}; color: white;">
      <h1>Kubernetes Showcase App</h1>
      <p>Version: ${APP_VERSION}</p>
      <p>Color: ${APP_COLOR}</p>
      <p>Running on Morpheus Kubernetes Service</p>
    </body>
    </html>
